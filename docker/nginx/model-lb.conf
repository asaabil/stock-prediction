# Load balancer untuk replika layanan model-serving.
# DNS Docker (127.0.0.11) mengembalikan IP semua replika. Nginx membagi request
# secara round robin dan membaca ulang DNS setiap 10 detik, sehingga replika baru
# (docker compose up --scale) ikut menerima request tanpa restart Nginx.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $model_serving http://model-serving:8080;
        proxy_pass $model_serving;
        proxy_set_header Host $host;
        # Menunjukkan replika mana yang melayani request
        add_header X-Served-By $upstream_addr always;
    }
}
